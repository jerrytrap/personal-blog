<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="kr">
<head>
    <meta charset="UTF-8">
    <title>Personal Blog</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<form th:action="@{'/admin/update/' + ${article.id}}" method="post">
    <input type="hidden" name="csrfToken" th:value="${csrfToken}" />
    <div>
        <label for="title">title</label><br>
        <input type="text" id="title" name="title" th:value="${article.title}">
    </div>
    <div>
        <label for="content">content</label><br>
        <textarea id="content" name="content" th:text="${article.content}"></textarea>
    </div>
    <input type="submit" value="수정">
</form>
</body>
</html>
